name: Google Search
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Google Search
        id: data
        uses: rocosen/flashdata-google-search-action@v0.1.1
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          query: retrieval augmented generation evaluation
          options-json: '{"num":5}'
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: google-search
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
