name: Google Search Evidence - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Export current web evidence for a research agent, with original titles,
          links, snippets and search positions.
        id: data
        uses: rocosen/flashdata-google-search-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          query: retrieval augmented generation evaluation
          options-json: '{"num":5}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: google-search
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
